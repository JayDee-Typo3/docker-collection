services:
    traefik:
        image: traefik:v3.4
        container_name: traefik
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true

        networks:
            # Connect to the 'traefik_proxy' overlay network for inter-container communication across nodes
            - homelab

        ports:
            - "80:80"
            - "443:443"
            - "8080:8080"

        volumes:
            - ${DOCKER_SOCKET_PATH}:/var/run/docker.sock:ro
            - ${CERTIFICATE_FOLDER_PATH}:/certs:ro
            - ${DYNAMIC_CONFIG_FOLDER_PATH}:/dynamic:ro

        command:
            # EntryPoints
            - "--entrypoints.web.address=:80"
            - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
            - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
            - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
            - "--entrypoints.websecure.address=:443"
            - "--entrypoints.websecure.http.tls=true"

            # Attach the static configuration tls.yaml file that contains the tls configuration settings
            - "--providers.file.filename=${TLS_FILE_PATH}"

            # Providers
            - "--providers.docker=true"
            - "--providers.docker.exposedbydefault=false"
            - "--providers.docker.network=proxy"

            # API & Dashboard
            - "--api.dashboard=true"
            - "--api.insecure=false"

            # Observability
            - "--log.level=INFO"
            - "--accesslog=true"
            - "--metrics.prometheus=true"

        # Traefik Dynamic configuration via Docker labels
        labels:
            # Enable self‑routing
            - "traefik.enable=true"

            # Dashboard router
            - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_DASHBOARD_LABEL_HOST}`)"
            - "traefik.http.routers.dashboard.entrypoints=websecure"
            - "traefik.http.routers.dashboard.service=api@internal"
            - "traefik.http.routers.dashboard.tls=true"

            # Basic‑auth middleware
            - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_BASIC_AUTH}"
            - "traefik.http.routers.dashboard.middlewares=dashboard-auth@docker"

    # Whoami application
    whoami:
        image: traefik/whoami
        container_name: whoami
        restart: unless-stopped
        networks:
            - homelab
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.whoami.rule=Host(`${TRAEFIK_WHOAMI_LABEL_HOST}`)"
            - "traefik.http.routers.whoami.entrypoints=websecure"
            - "traefik.http.routers.whoami.tls=true"

networks:
    homelab:
        name: homelab
